  <!-- ===== 抽卡節奏精修測試：只整理震動→翻牌；SSR 原本金光完整保留 ===== -->
  <style id="gachaRhythmRefine">
    /*
      1) 單抽：翻牌前短蓄力一次；十抽：十張落完後集體短蓄力一次，再依序翻牌。
      2) 不碰既有 3D rotateY 翻牌、不碰 v5 落牌、不碰漫畫過場。
      3) 不覆蓋 SSR 的 epicGoldGlow / cardShine，讓 Pickcard.css 原本金光與流光照常運作。
    */
    @keyframes gachaChargeRefined {
      0%   { transform: translate(0, 0) rotate(0deg); }
      18%  { transform: translate(-0.6px, 0.3px) rotate(-0.12deg); }
      36%  { transform: translate(0.7px, -0.4px) rotate(0.14deg); }
      54%  { transform: translate(-0.8px, -0.2px) rotate(-0.16deg); }
      70%  { transform: translate(1.2px, 0.3px) rotate(0.22deg); }
      82%  { transform: translate(-1.8px, -0.5px) rotate(-0.34deg); }
      92%  { transform: translate(1.5px, 0.4px) rotate(0.28deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .card-3d-container.shaking {
      animation: gachaChargeRefined var(--gacha-charge-duration, 0.46s) cubic-bezier(.35,.05,.2,1) 1 both !important;
      transform-origin: center center;
    }

    /*
      十連抽專用：
      總蓄力時間仍由 JS 控制為 900ms，
      但震動本身恢復成快速連續循環，不再把 900ms 當成「只震一次」。
      直接沿用原本 Pickcard.css 的 violentShake 幅度，
      並把每輪縮到 0.16s，讓十張一起震時更有蓄力感。
      單抽不受影響。
    */
    #gachaModalContent.wide-modal .card-3d-container.shaking {
      animation: violentShake 0.16s linear infinite !important;
      transform-origin: center center;
    }

    @media (prefers-reduced-motion: reduce) {
      .card-3d-container.shaking,
      #gachaModalContent.wide-modal .card-3d-container.shaking {
        animation: none !important;
      }
    }
  </style>

  <!-- ======================================================

       招賢台抽卡與機率邏輯

  ====================================================== -->



  <script>

    // ==========================================
    // 曹操五格漫畫抽卡前場（不更動抽卡機率與翻牌邏輯）
    // ==========================================
    let gachaComicBusy = false;
    let gachaComicTimers = [];
    let gachaComicDone = null;

    // ==========================================
    // SSR 揭曉音效（只在 SSR 卡真正翻開時播放）
    // 音檔位置：audio/ssr-reveal.mp3
    // ==========================================
    // 卡牌翻牌音效：R / SR / SSR 每張真正翻開時都播放。
    // SSR 會在同一個翻牌瞬間再疊加下方的古戰場揭曉音效。
    const CARD_FLIP_SOUND_SRC = 'audio/card-flip.mp3';
    const cardFlipSoundTemplate = new Audio(CARD_FLIP_SOUND_SRC);
    cardFlipSoundTemplate.preload = 'auto';
    cardFlipSoundTemplate.volume = 0.70;

    const SSR_REVEAL_SOUND_SRC = 'audio/ssr-reveal.mp3';
    const ssrRevealSoundTemplate = new Audio(SSR_REVEAL_SOUND_SRC);
    ssrRevealSoundTemplate.preload = 'auto';
    ssrRevealSoundTemplate.volume = 1.00;

    function primeSSRRevealSound() {
      // 第一次使用者互動時先喚醒／載入音效，降低手機與線上版首次播放延遲。
      const probe = ssrRevealSoundTemplate.cloneNode(true);
      probe.muted = true;
      probe.volume = 0;

      const playPromise = probe.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise
          .then(() => {
            probe.pause();
            probe.currentTime = 0;
          })
          .catch(() => {});
      }
    }

    function primeCardFlipSound() {
      // 與 SSR 音效相同：第一次使用者互動時先靜音喚醒，降低首次翻牌延遲。
      const probe = cardFlipSoundTemplate.cloneNode(true);
      probe.muted = true;
      probe.volume = 0;

      const playPromise = probe.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise
          .then(() => {
            probe.pause();
            probe.currentTime = 0;
          })
          .catch(() => {});
      }
    }

    document.addEventListener('pointerdown', primeCardFlipSound, { once: true, passive: true });
    document.addEventListener('pointerdown', primeSSRRevealSound, { once: true, passive: true });

    function playCardFlipSound() {
      // 十連每 235ms 可能連續翻牌，因此每張卡使用獨立播放器，避免前一張被截斷。
      const sound = cardFlipSoundTemplate.cloneNode(true);
      sound.volume = cardFlipSoundTemplate.volume;
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function playSSRRevealSoundForCard(card) {
      if (!card || !card.classList.contains('rarity-ssr')) return;

      // 每次揭曉都複製一個播放器，避免十連中連續 SSR 互相截斷。
      const sound = ssrRevealSoundTemplate.cloneNode(true);
      sound.volume = ssrRevealSoundTemplate.volume;
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }


    // ==========================================
    // 抽卡新增音效（正式 audio 檔；不改動既有翻牌 / SSR 音效函式）
    // 1) 卡背旋轉落下：單抽 1 次；十抽依 90ms 落牌節奏逐張播放。
    // 2) 單抽揭曉前：使用古風重戰鼓，壓進 460ms 蓄力段。
    // ==========================================
    const GACHA_CARD_DROP_SOUND_SRC = 'audio/gacha-card-drop.mp3';
    const gachaCardDropSoundTemplate = new Audio(GACHA_CARD_DROP_SOUND_SRC);
    gachaCardDropSoundTemplate.preload = 'auto';
    gachaCardDropSoundTemplate.volume = 0.82;

    const GACHA_SINGLE_CHARGE_SOUND_SRC = 'audio/gacha-single-charge.mp3';
    const gachaSingleChargeSoundTemplate = new Audio(GACHA_SINGLE_CHARGE_SOUND_SRC);
    gachaSingleChargeSoundTemplate.preload = 'auto';
    gachaSingleChargeSoundTemplate.volume = 1.0;

    function primeExtraGachaSounds() {
      [gachaCardDropSoundTemplate, gachaSingleChargeSoundTemplate].forEach(template => {
        const probe = template.cloneNode(true);
        probe.muted = true;
        probe.volume = 0;
        const playPromise = probe.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise
            .then(() => {
              probe.pause();
              probe.currentTime = 0;
            })
            .catch(() => {});
        }
      });
    }

    document.addEventListener('pointerdown', primeExtraGachaSounds, { once: true, passive: true });

    function playGachaCardDropSound(isTenPull = false) {
      const sound = gachaCardDropSoundTemplate.cloneNode(true);
      sound.volume = isTenPull ? 0.30 : 0.82;
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function playGachaSingleChargeSound() {
      const sound = gachaSingleChargeSoundTemplate.cloneNode(true);
      sound.volume = 1.0;
      sound.playbackRate = 1.76;
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    // ==========================================
    // 漫畫 / 單抽角色特寫過場音效
    // 需要放在 audio 資料夾：
    // gacha-intro-rumble.mp3  史書震動
    // gacha-intro-burst.mp3   金光爆發
    // gacha-intro-flash.mp3   最後爆閃 / 單抽爆閃
    // ==========================================
    const GACHA_INTRO_PAGE_SOUND_SRC = 'audio/gacha-intro-page.mp3';
    const GACHA_INTRO_GLOW_SOUND_SRC = 'audio/gacha-intro-glow.mp3';
    const GACHA_INTRO_EYE_SOUND_SRC = 'audio/gacha-intro-eye.mp3';
    const GACHA_INTRO_RUMBLE_SOUND_SRC = 'audio/gacha-intro-rumble.mp3';
    const GACHA_INTRO_BURST_SOUND_SRC = 'audio/gacha-intro-burst.mp3';
    const GACHA_INTRO_FLASH_SOUND_SRC = 'audio/gacha-intro-flash.mp3';

    const gachaIntroPageSoundTemplate = new Audio(GACHA_INTRO_PAGE_SOUND_SRC);
    const gachaIntroGlowSoundTemplate = new Audio(GACHA_INTRO_GLOW_SOUND_SRC);
    const gachaIntroEyeSoundTemplate = new Audio(GACHA_INTRO_EYE_SOUND_SRC);
    const gachaIntroRumbleSoundTemplate = new Audio(GACHA_INTRO_RUMBLE_SOUND_SRC);
    const gachaIntroBurstSoundTemplate = new Audio(GACHA_INTRO_BURST_SOUND_SRC);
    const gachaIntroFlashSoundTemplate = new Audio(GACHA_INTRO_FLASH_SOUND_SRC);

    gachaIntroPageSoundTemplate.preload = 'auto';
    gachaIntroGlowSoundTemplate.preload = 'auto';
    gachaIntroEyeSoundTemplate.preload = 'auto';
    gachaIntroRumbleSoundTemplate.preload = 'auto';
    gachaIntroBurstSoundTemplate.preload = 'auto';
    gachaIntroFlashSoundTemplate.preload = 'auto';

    gachaIntroPageSoundTemplate.volume = 0.78;
    gachaIntroGlowSoundTemplate.volume = 0.86;
    gachaIntroEyeSoundTemplate.volume = 1.00;
    gachaIntroRumbleSoundTemplate.volume = 1.00;
    gachaIntroBurstSoundTemplate.volume = 1.00;
    gachaIntroFlashSoundTemplate.volume = 1.00;

    const activeGachaIntroSounds = new Set();

    function primeGachaIntroSounds() {
      [
        gachaIntroPageSoundTemplate,
        gachaIntroGlowSoundTemplate,
        gachaIntroEyeSoundTemplate,
        gachaIntroRumbleSoundTemplate,
        gachaIntroBurstSoundTemplate,
        gachaIntroFlashSoundTemplate
      ].forEach(template => {
        const probe = template.cloneNode(true);
        probe.muted = true;
        probe.volume = 0;
        const playPromise = probe.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise
            .then(() => {
              probe.pause();
              probe.currentTime = 0;
            })
            .catch(() => {});
        }
      });
    }

    document.addEventListener('pointerdown', primeGachaIntroSounds, { once: true, passive: true });

    function playGachaIntroSound(template, volume = null) {
      if (!template) return;

      const sound = template.cloneNode(true);
      sound.volume = volume === null ? template.volume : volume;
      sound.currentTime = 0;

      activeGachaIntroSounds.add(sound);

      const cleanup = () => {
        activeGachaIntroSounds.delete(sound);
        sound.removeEventListener('ended', cleanup);
        sound.removeEventListener('error', cleanup);
      };

      sound.addEventListener('ended', cleanup);
      sound.addEventListener('error', cleanup);
      sound.play().catch(cleanup);
    }

    function stopGachaIntroSounds() {
      activeGachaIntroSounds.forEach(sound => {
        try {
          sound.pause();
          sound.currentTime = 0;
        } catch (_) {}
      });
      activeGachaIntroSounds.clear();
    }

    function playGachaIntroPageSound() {
      playGachaIntroSound(gachaIntroPageSoundTemplate);
    }

    function playGachaIntroGlowSound() {
      playGachaIntroSound(gachaIntroGlowSoundTemplate);
    }

    function playGachaIntroEyeSound() {
      playGachaIntroSound(gachaIntroEyeSoundTemplate);
    }

    function playGachaIntroRumbleSound() {
      playGachaIntroSound(gachaIntroRumbleSoundTemplate);
    }

    function playGachaIntroBurstSound() {
      playGachaIntroSound(gachaIntroBurstSoundTemplate);
    }

    function playGachaIntroFlashSound() {
      playGachaIntroSound(gachaIntroFlashSoundTemplate);
    }


    // ==========================================
    // 十連抽專屬 BGM
    // - 只在十抽使用；單抽不播放
    // - 開始時通知 main.js 暫停全站 BGM
    // - 十張揭曉完成後淡出，再通知 main.js 接回全站 BGM
    // ==========================================
    const GACHA_TEN_BGM_SRC = 'audio/gacha-ten-bgm.mp3';
    const gachaTenBgmTemplate = new Audio(GACHA_TEN_BGM_SRC);
    gachaTenBgmTemplate.preload = 'auto';
    gachaTenBgmTemplate.volume = 0.58;

    let activeTenPullBgm = null;
    let tenPullBgmFadeTimer = null;

    function primeTenPullBgm() {
      const probe = gachaTenBgmTemplate.cloneNode(true);
      probe.muted = true;
      probe.volume = 0;

      const playPromise = probe.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise
          .then(() => {
            probe.pause();
            probe.currentTime = 0;
          })
          .catch(() => {});
      }
    }

    document.addEventListener(
      'pointerdown',
      primeTenPullBgm,
      { once: true, passive: true }
    );

    function startTenPullBgm() {
      // 十抽專屬 BGM 屬於抽卡演出音樂，
      // 即使玩家關閉全站背景 BGM，也仍然照常播放。
      if (tenPullBgmFadeTimer) {
        clearInterval(tenPullBgmFadeTimer);
        tenPullBgmFadeTimer = null;
      }

      if (activeTenPullBgm) {
        try {
          activeTenPullBgm.pause();
          activeTenPullBgm.currentTime = 0;
        } catch (_) {}
      }

      window.dispatchEvent(
        new CustomEvent('sanguo:gacha-bgm-start')
      );

      const music = gachaTenBgmTemplate.cloneNode(true);
      activeTenPullBgm = music;
      music.currentTime = 0;
      music.loop = false;
      music.volume = 0;

      const targetVolume = 0.58;
      const startedAt = performance.now();

      const playPromise = music.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {
          if (activeTenPullBgm === music) activeTenPullBgm = null;
          window.dispatchEvent(
            new CustomEvent('sanguo:gacha-bgm-end')
          );
        });
      }

      tenPullBgmFadeTimer = setInterval(() => {
        const progress = Math.min(
          1,
          (performance.now() - startedAt) / 260
        );

        music.volume = targetVolume * progress;

        if (progress >= 1) {
          clearInterval(tenPullBgmFadeTimer);
          tenPullBgmFadeTimer = null;
        }
      }, 16);
    }

    function stopTenPullBgm({
      fadeMs = 520,
      resumeSiteBgm = true
    } = {}) {
      const music = activeTenPullBgm;

      if (tenPullBgmFadeTimer) {
        clearInterval(tenPullBgmFadeTimer);
        tenPullBgmFadeTimer = null;
      }

      const finish = () => {
        if (music) {
          try {
            music.pause();
            music.currentTime = 0;
          } catch (_) {}
        }

        if (activeTenPullBgm === music) {
          activeTenPullBgm = null;
        }

        if (resumeSiteBgm) {
          window.dispatchEvent(
            new CustomEvent('sanguo:gacha-bgm-end')
          );
        }
      };

      if (!music || music.paused || fadeMs <= 0) {
        finish();
        return;
      }

      const startVolume = music.volume;
      const startedAt = performance.now();

      tenPullBgmFadeTimer = setInterval(() => {
        const progress = Math.min(
          1,
          (performance.now() - startedAt) / fadeMs
        );

        music.volume =
          startVolume * (1 - progress);

        if (progress >= 1) {
          clearInterval(tenPullBgmFadeTimer);
          tenPullBgmFadeTimer = null;
          finish();
        }
      }, 16);
    }

    function finishGachaComicIntro() {
      if (!gachaComicBusy) return;
      const callback = gachaComicDone;
      gachaComicDone = null;
      gachaComicBusy = false;
      gachaComicTimers.forEach(clearTimeout);
      gachaComicTimers = [];
      const overlay = document.getElementById('gachaIntro');
      overlay.classList.remove('is-playing');

    function playGachaComicIntro(onComplete = null) {
      if (gachaComicBusy) return;
      const overlay = document.getElementById('gachaIntro');
      if (!overlay) {
        if (typeof onComplete === 'function') onComplete();
        return;
      }
      gachaComicBusy = true;
      gachaComicDone = onComplete;
      gachaComicTimers.forEach(clearTimeout);
      gachaComicTimers = [];

      // 十連抽第五格永遠固定曹操，不受任何單抽角色過場換圖影響。
      applySinglePullTeaserVisual(null);
      applySinglePullTeaserFlashStyle(null);

      const scenes = Array.from(overlay.querySelectorAll('[data-comic-scene]'));
      const flash = document.getElementById('gachaIntroFlash');
      const shock = document.getElementById('gachaIntroShock');
      scenes.forEach(s => s.classList.remove('is-current','is-trembling','is-ignited','is-eye-glowing'));
      flash.classList.remove('is-firing');
      if (shock) shock.classList.remove('is-bursting');
      void overlay.offsetWidth;
      document.body.classList.add('gacha-intro-body-lock');
      overlay.classList.add('is-playing');
      overlay.setAttribute('aria-hidden','false');

      // 十抽漫畫一開始就切換到專屬古風戰爭 BGM。
      startTenPullBgm();

      // v5 真實時間軸 + v6 分格定位；換格時前一格就消失
      function showScene(index) {
        scenes.forEach((scene, i) => scene.classList.toggle('is-current', i === index));
      }
      [160, 1330, 2480, 3750, 5000].forEach((ms, i) => scheduleGachaComic(ms, () => showScene(i)));

      // 第 1 格：曹操閱史，畫面出現後補一個很輕的翻書／木桌細響。

        scenes[2].classList.add('is-trembling');

      scheduleGachaComic(3750, () => scenes[2].classList.remove('is-trembling'));
      scheduleGachaComic(4020, () => {
        scenes[3].classList.add('is-ignited');
        if (shock) shock.classList.add('is-bursting');
        playGachaIntroBurstSound();
      });
      scheduleGachaComic(5450, () => {
        scenes[4].classList.add('is-eye-glowing');
        playGachaIntroEyeSound();
      });
      scheduleGachaComic(6070, () => {
        flash.classList.add('is-firing');
        playGachaIntroFlashSound();
      });
      scheduleGachaComic(6490, finishGachaComicIntro);
    }

    function applySinglePullTeaserVisual(teaser) {
      const scene5Image = document.getElementById('gachaIntroScene5Image');
      if (!scene5Image) return;

      const defaultSrc = scene5Image.dataset.defaultSrc || 'images/gacha-comic/05.webp';
      const defaultAlt = scene5Image.dataset.defaultAlt || '曹操金瞳展開';
      const defaultPosition = scene5Image.dataset.defaultPosition || '50% 46%';

      scene5Image.src = teaser?.imageSrc || defaultSrc;
      scene5Image.alt = teaser?.imageAlt || defaultAlt;
      scene5Image.style.objectPosition = teaser?.imagePosition || defaultPosition;
    }

    // 線上版防殘影：先讓「本次抽中的角色過場圖」在隱藏狀態完成載入／解碼，
    // 確認圖片真的準備好之後才開啟過場，避免上一抽角色先閃一下才換圖。
    function prepareSinglePullTeaserVisual(teaser) {
      const scene5Image = document.getElementById('gachaIntroScene5Image');
      if (!scene5Image) return Promise.resolve();

      applySinglePullTeaserVisual(teaser);

      const decodeCurrentImage = () => {
        if (typeof scene5Image.decode === 'function') {
          return scene5Image.decode().catch(() => {});
        }
        return Promise.resolve();
      };

      if (scene5Image.complete && scene5Image.naturalWidth > 0) {
        return decodeCurrentImage();
      }

      return new Promise(resolve => {
        const cleanup = () => {
          scene5Image.removeEventListener('load', handleLoad);
          scene5Image.removeEventListener('error', handleError);
        };

        const handleLoad = () => {
          cleanup();
          decodeCurrentImage().finally(resolve);
        };

        const handleError = () => {
          cleanup();
          // 圖檔若真的不存在，仍讓原本流程繼續，避免整個抽卡被卡死。
          resolve();
        };

        scene5Image.addEventListener('load', handleLoad, { once: true });
        scene5Image.addEventListener('error', handleError, { once: true });
      });
    }

    function applySinglePullTeaserFlashStyle(teaser) {
      const flash = document.getElementById('gachaIntroFlash');
      if (!flash) return;

      const tone = teaser?.flashTone || 'gold';
      if (tone === 'silver') {
        // SR：維持明亮、乾淨、接近純白的銀色爆閃。
        flash.style.background = 'radial-gradient(circle, rgba(255,255,255,0.98) 0%, rgba(231,239,255,0.92) 26%, rgba(191,208,232,0.60) 54%, rgba(150,170,198,0.00) 82%)';
        flash.style.boxShadow = '0 0 120px rgba(245,248,255,0.58), 0 0 240px rgba(176,194,224,0.38)';
        flash.style.filter = 'brightness(1.08) saturate(0.88)';
      } else if (tone === 'ice') {
        // R／甄姬：刻意壓低純白核心，改成明顯的冰藍＋紫藍。
        // 這樣播放速度再快，也不會看起來跟 SR 的銀白光一樣。
        flash.style.background = 'radial-gradient(circle, rgba(214,234,255,0.96) 0%, rgba(132,190,255,0.88) 24%, rgba(105,151,255,0.67) 47%, rgba(170,108,255,0.47) 66%, rgba(102,123,214,0.00) 84%)';
        flash.style.boxShadow = '0 0 105px rgba(165,211,255,0.62), 0 0 215px rgba(105,164,255,0.47), 0 0 315px rgba(169,106,255,0.34)';
        flash.style.filter = 'brightness(0.94) saturate(1.34)';
      } else if (tone === 'melody') {
        // R／蔡文姬：同樣使用明顯冰藍基底，但外圈加入淡金琴韻。
        // 與甄姬同屬 R，卻保留蔡文姬自己的文雅氣質。
        flash.style.background = 'radial-gradient(circle, rgba(218,238,255,0.95) 0%, rgba(126,194,255,0.86) 23%, rgba(103,158,232,0.65) 46%, rgba(255,205,118,0.38) 66%, rgba(104,137,206,0.00) 84%)';
        flash.style.boxShadow = '0 0 105px rgba(168,216,255,0.60), 0 0 210px rgba(100,170,236,0.44), 0 0 300px rgba(255,205,118,0.29)';
        flash.style.filter = 'brightness(0.95) saturate(1.28)';
      } else if (tone === 'crimson') {
        // R／孫尚香：用偏紅楓葉＋暖金的爆閃，和 SR 銀光、SSR 金光明顯區隔。
        flash.style.background = 'radial-gradient(circle, rgba(255,240,224,0.94) 0%, rgba(255,178,126,0.86) 20%, rgba(255,116,96,0.72) 42%, rgba(233,64,96,0.52) 62%, rgba(126,40,82,0.00) 84%)';
        flash.style.boxShadow = '0 0 110px rgba(255,196,148,0.58), 0 0 220px rgba(255,118,104,0.43), 0 0 320px rgba(214,55,96,0.28)';
        flash.style.filter = 'brightness(0.96) saturate(1.34)';
      } else if (tone === 'blossom') {
        // R／大喬小喬：用櫻粉紫光搭配暖金燈影，強調雙姝的柔美與華麗，並和 SR 的銀白光分開。
        flash.style.background = 'radial-gradient(circle, rgba(255,240,252,0.96) 0%, rgba(255,196,224,0.90) 22%, rgba(232,152,210,0.74) 44%, rgba(178,126,236,0.52) 63%, rgba(255,205,156,0.28) 76%, rgba(88,66,132,0.00) 86%)';
        flash.style.boxShadow = '0 0 108px rgba(255,214,235,0.60), 0 0 220px rgba(227,154,212,0.43), 0 0 310px rgba(180,130,236,0.28), 0 0 360px rgba(255,205,156,0.16)';
        flash.style.filter = 'brightness(0.97) saturate(1.26)';
      } else if (tone === 'charm') {
        // R／貂蟬：月白冰藍基底混入桃紫魅影，避免和 SR 銀白爆閃混在一起。
        flash.style.background = 'radial-gradient(circle, rgba(244,237,255,0.95) 0%, rgba(206,176,255,0.88) 21%, rgba(184,117,238,0.72) 43%, rgba(237,103,184,0.50) 63%, rgba(116,75,172,0.00) 85%)';
        flash.style.boxShadow = '0 0 108px rgba(224,201,255,0.60), 0 0 220px rgba(184,123,238,0.43), 0 0 315px rgba(237,103,184,0.29)';
        flash.style.filter = 'brightness(0.96) saturate(1.31)';
      } else if (tone === 'jade') {
        // R／關銀屏：用青綠玉色＋微冷白光，保留英氣與少女感，也和 SR 銀光明顯區分。
        flash.style.background = 'radial-gradient(circle, rgba(239,255,244,0.94) 0%, rgba(168,238,204,0.86) 22%, rgba(102,205,170,0.70) 44%, rgba(70,170,146,0.52) 64%, rgba(42,94,88,0.00) 84%)';
        flash.style.boxShadow = '0 0 108px rgba(193,247,220,0.56), 0 0 220px rgba(104,214,176,0.41), 0 0 310px rgba(74,166,141,0.27)';
        flash.style.filter = 'brightness(0.97) saturate(1.24)';
      } else {
        flash.style.background = '';
        flash.style.boxShadow = '';
        flash.style.filter = '';
      }
    }

    function playSinglePullCharacterTeaser(hero, onComplete = null) {
      const teaser = hero ? singlePullTeaserMap[hero.name] : null;

      // 還沒製作專屬過場的武將，維持原本行為：直接進入卡牌出場。
      if (!teaser) {
        applySinglePullTeaserVisual(null);
        applySinglePullTeaserFlashStyle(null);
        if (typeof onComplete === 'function') onComplete();
        return;
      }

      if (gachaComicBusy) return;

      const overlay = document.getElementById('gachaIntro');
      if (!overlay) {
        if (typeof onComplete === 'function') onComplete();
        return;
      }

      const scenes = Array.from(overlay.querySelectorAll('[data-comic-scene]'));
      const scene = scenes[teaser.sceneIndex];
      const flash = document.getElementById('gachaIntroFlash');
      const shock = document.getElementById('gachaIntroShock');

      if (!scene) {
        if (typeof onComplete === 'function') onComplete();
        return;
      }

      // 從開始準備圖片就鎖住下一次招募，避免網路較慢時重複點擊造成兩輪過場交錯。
      gachaComicBusy = true;
      gachaComicDone = onComplete;
      gachaComicTimers.forEach(clearTimeout);
      gachaComicTimers = [];

      // 先把上一輪動畫狀態清掉，但此時 overlay 仍然是隱藏的。
      scenes.forEach(s => s.classList.remove('is-current','is-trembling','is-ignited','is-eye-glowing'));
      if (flash) flash.classList.remove('is-firing');
      if (shock) shock.classList.remove('is-bursting');

      applySinglePullTeaserFlashStyle(teaser);

      // 關鍵修正：本次角色圖完成 load + decode 後，才真正打開過場。
      // GitHub Pages / 手機網路下就不會短暫顯示上一抽的角色。
      prepareSinglePullTeaserVisual(teaser).then(() => {
        // 若等待圖片期間玩家用 Escape 跳過，finishGachaComicIntro 會把 busy 關掉；
        // 這時不再重新打開已被跳過的過場。
        if (!gachaComicBusy) return;

        void overlay.offsetWidth;
        document.body.classList.add('gacha-intro-body-lock');
        overlay.classList.add('is-playing');
        overlay.setAttribute('aria-hidden', 'false');
        scene.classList.add('is-current');

        scheduleGachaComic(teaser.eyeGlowDelay, () => {
          scene.classList.add('is-eye-glowing');
          playGachaIntroEyeSound();
        });
        scheduleGachaComic(teaser.flashDelay, () => {
          if (flash) flash.classList.add('is-firing');
          playGachaIntroFlashSound();
        });
        scheduleGachaComic(teaser.finishDelay, finishGachaComicIntro);

    function updateTokenUI(

      const tokenCountEl =

        document.getElementById(

          'tokenCount'

        );

      if (tokenCountEl) {

        const nextCount = Number(count);
        const previousCount =
          tokenCountEl.dataset.currentCount === undefined
            ? nextCount
            : Number(tokenCountEl.dataset.currentCount);

        tokenCountEl.textContent = count;
        tokenCountEl.dataset.currentCount = String(nextCount);

        // 只有真的扣除招賢令時才給短回饋；首次載入不播放。

          const panel = tokenCountEl.closest('.recruit-token-count');

            panel.classList.add('token-spend-feedback');

              panel.classList.remove('token-spend-feedback');
            }, 420);
          }
        }

      }

    function recruit(

      count

    ) {

      if (gachaComicBusy) return;





      let tokens =

        parseInt(

          localStorage.getItem(

            'userTokens'

          )

          ||

          0

        );





      let heroes =

        getSyncedHeroesData();







      // 呂布是 NPC 彩蛋角色

      // exchangeOnly 只用來排除一般抽卡池，
      // 真正解鎖由 main.js 的呂布 × 貂蟬事件負責

      let lockedHeroes =

        heroes.filter(

          h =>

            !h.unlocked &&

            !h.exchangeOnly

        );





      if (

        lockedHeroes.length === 0

      ) {



        showPickAlert(



          "目前已沒有可透過招賢台取得的武將。",



          "招 賢 完 成"



        );



        return;



      }



      /*
        最終串接修正：
        如果普通卡池剩餘角色少於玩家按下的抽數，
        只扣實際能招募的數量，避免「只剩 3 人卻扣 10 枚招賢令」。
        十連按鈕仍維持十連漫畫與十連舞台，不改演出規格。
      */
      const actualRecruitCount =
        Math.min(
          count,
          lockedHeroes.length
        );



      // 招賢令不足：以本次真正能抽到的數量判定。
      if (
        tokens < actualRecruitCount
      ) {

        showPickAlert(
          "招賢令數量不足，請前往「群雄問答」挑戰獲取更多代幣",
          "招 賢 令 不 足"
        );

        return;
      }



      // 扣除實際招募數量

      tokens -= actualRecruitCount;





      localStorage.setItem(

        'userTokens',

        tokens

      );





      updateTokenUI(

        tokens

      );







      let drawnHeroes = [];







      // ========================================

      // 開始抽卡

      // ========================================



      for (

        let i = 0;

        i < actualRecruitCount;

        i++

      ) {





        let currentLocked =

          heroes.filter(

            h =>

              !h.unlocked &&

              !h.exchangeOnly

          );





        if (

          currentLocked.length === 0

        ) {

          break;

        }







        // ======================================

        // 機率

        //

        // SSR 20%

        // SR  70%

        // R   10%

        // ======================================



        const rand =

          Math.random()

          *

          100;





        let targetRarity =

          'r';





        if (

          rand < 20

        ) {



          targetRarity =

            'ssr';



        }



        else if (

          rand < 90

        ) {



          targetRarity =

            'sr';



        }



        else {



          targetRarity =

            'r';



        }







        let pool =

          currentLocked.filter(

            h =>

              h.rarity ===

              targetRarity

          );





        // 如果該稀有度已經抽完

        // 就從其他未解鎖角色補

        if (

          pool.length === 0

        ) {



          pool =

            currentLocked;



        }







        const randomIndex =

          Math.floor(

            Math.random()

            *

            pool.length

          );





        let selectedHero =

          pool[

            randomIndex

          ];







        heroes =

          heroes.map(

            h => {





              if (

                h.name ===

                selectedHero.name

              ) {



                return {

                  ...h,

                  unlocked: true

                };



              }





              return h;



            }

          );





        drawnHeroes.push(

          selectedHero

        );



      }







      localStorage.setItem(

        'heroesData',

        JSON.stringify(

          heroes

        )

      );





      if (count === 10 && drawnHeroes.length > 0) {
        // 十連抽維持原本完整曹操五格漫畫，不改流程。
        playGachaComicIntro(() => showGachaResults(drawnHeroes, count));
      } else if (count === 1 && drawnHeroes.length === 1) {
        // 單抽先依真正抽到的武將播放專屬特徵過場；目前曹操使用 05.png。
        // 過場播完後才進入同一張已抽中的卡，不會再次 random。
        playSinglePullCharacterTeaser(
          drawnHeroes[0],
          () => showGachaResults(drawnHeroes, count)
        );
      } else {
        showGachaResults(drawnHeroes, count);
      }



    }

    // ==========================================
    // v5 十連抽：十張卡背從光中順序旋轉落牌（並非 v7/v8 召喚門）
    // ==========================================
    function startV5TenPull(cardItems, onComplete) {
      const modal = document.getElementById('gachaModal');
      if (!modal || cardItems.length === 0) { onComplete(); return; }
      if (window.stopV5TenPull) window.stopV5TenPull();
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const spacing = reduced ? 0 : 90;
      const duration = reduced ? 150 : 850;
      const dropSoundTimers = [];
      const isTenPull = cardItems.length > 1;
      let finished = false;
      let timeoutId = null;
      function dispose() {
        if (finished) return;
        finished = true;
        if (timeoutId !== null) clearTimeout(timeoutId);
        dropSoundTimers.forEach(clearTimeout);
        modal.classList.remove('v5-ten-pull-active');
        cardItems.forEach(card => card.classList.remove('v5-card-dropping'));
        if (window.stopV5TenPull === dispose) window.stopV5TenPull = null;
      }
      window.stopV5TenPull = dispose;
      modal.classList.add('v5-ten-pull-active');
      cardItems.forEach((card, i) => {
        card.style.setProperty('--v5-order', i);
        card.classList.add('v5-card-dropping');

        // 與原本落牌的 90ms 間隔同步；只加聲音，不改動畫。
        if (!reduced || i === 0) {
          dropSoundTimers.push(
            setTimeout(() => playGachaCardDropSound(isTenPull), i * spacing)
          );
        }
      });
      timeoutId = setTimeout(() => {
        dispose();
        onComplete();
      }, (cardItems.length - 1) * spacing + duration + 160);
    }

          if (quote) {
            quote.classList.remove('gacha-quote-hidden');
            quote.classList.add('gacha-quote-fadein');
          }

          // 十連最後一張完成翻面後，專屬 BGM 才淡出；
          // 單抽沒有啟動 ten-pull BGM，因此完全不受影響。
          if (count === 10 && activeTenPullBgm) {
            stopTenPullBgm({
              fadeMs: 520,
              resumeSiteBgm: true
            });
          }

          btnGroup.style.opacity = '1';
          btnGroup.style.pointerEvents = 'auto';
        });
      }

      function flipCardsSequentially(firstFlipAt = 0, flipSpacing = 235) {
        cardItems.forEach((card, index) => {
          laterGacha(firstFlipAt + index * flipSpacing, () => {
            card.classList.remove('shaking');
            card.classList.add('flipped');
            playCardFlipSound();
            playSSRRevealSoundForCard(card);

            // 十連抽蓄力後的邊緣光會陪著這張卡完成整段 3D 翻牌，
            // 不會在翻牌剛開始時突然消失。
            laterGacha(820, () => {
              card.classList.remove('gacha-edge-hold');
            });

            if (index === cardItems.length - 1) {
              finishResultAfterLastFlip();
            }
          });
        });
      }

      function startSinglePullShakeAndFlip() {
        // 單抽維持上一版手感：一張卡自己短蓄力，接著直接翻開。
        const card = cardItems[0];
        if (!card) return;

        const reduced = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const chargeDuration = reduced ? 80 : 460;
        const flipAt = reduced ? 100 : 500;
        const chargeAt = Math.max(0, flipAt - chargeDuration);

        laterGacha(chargeAt, () => {
          card.style.removeProperty('--gacha-charge-duration');
          card.classList.remove('shaking');
          void card.offsetWidth;
          card.classList.add('shaking');
          playGachaSingleChargeSound();
        });

        laterGacha(flipAt, () => {
          card.classList.remove('shaking');
          card.classList.add('flipped');
          playCardFlipSound();
          playSSRRevealSoundForCard(card);
          finishResultAfterLastFlip();
        });
      }

      function startTenPullGroupShakeAndFlip() {
        /*
          十抽新節奏：
          v5 十張依序落牌完成
          → startV5TenPull 本身已留約 160ms 靜止
          → 十張同時短蓄力一次
          → 全部停住一小拍
          → 再乾淨地依序翻牌

          不再「每張輪到自己才震」，避免依序落 → 依序震 → 依序翻三層排隊感。
        */
        const reduced = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const groupChargeDuration = reduced ? 80 : 900;
        const settleAfterCharge = reduced ? 20 : 120;
        const flipSpacing = reduced ? 70 : 235;

        cardItems.forEach(card => {
          card.classList.remove('shaking');
          card.style.setProperty(
            '--gacha-charge-duration',
            `${groupChargeDuration}ms`
          );
        });

        // 同一個 frame 讓十張一起開始蓄力。
        if (cardItems[0]) void cardItems[0].offsetWidth;
        cardItems.forEach(card => card.classList.add('shaking'));

        // 十連抽整組只播放一次蓄力音效，不會十張各自重疊播放。
        playGachaSingleChargeSound();

        laterGacha(groupChargeDuration, () => {
          cardItems.forEach(card => {
            card.classList.remove('shaking');
            card.classList.add('gacha-edge-hold');
            card.style.removeProperty('--gacha-charge-duration');
          });
        });

        // 全部停止後留一小拍，再開始逐張揭曉。
        flipCardsSequentially(
          groupChargeDuration + settleAfterCharge,
          flipSpacing
        );
      }

      if (count === 10 && cardItems.length >= 1) {
        // 十連抽：即使卡池最後只剩 1 張，也維持 v5 落牌 → 集體蓄力 → 翻牌。
        startV5TenPull(cardItems, () => startTenPullGroupShakeAndFlip());
      } else if (count === 1 && cardItems.length === 1) {
        // 單抽仍沿用 v5 卡背落牌，再做一張卡自己的短蓄力 → 翻牌。
        startV5TenPull(cardItems, () => startSinglePullShakeAndFlip());
      } else {
        // 保底分支：沒有十張時直接依序翻開。
        flipCardsSequentially(0, 235);
      }

    }




    // ==========================================

    // 關閉抽卡結果

    // ==========================================



    function closeGachaModal() {
      // 保險：若玩家在特殊情況下關閉結果，十抽專屬 BGM 也要收乾淨。
      if (activeTenPullBgm) {
        stopTenPullBgm({
          fadeMs: 220,
          resumeSiteBgm: true
        });
      }

      // 先停止所有尚未完成的抽卡計時器，避免關閉後仍有翻牌／亮光 callback 執行。
      if (window.gachaStageTimers) {
        window.gachaStageTimers.forEach(clearTimeout);
        window.gachaStageTimers = [];
      }

      if (window.stopV5TenPull) {
        window.stopV5TenPull();
      }

      const modal = document.getElementById('gachaModal');
      const cardBox = document.getElementById('gachaCardBox');
      const btnGroup = document.getElementById('gachaBtnGroup');

      if (modal) {
        // 把本輪抽卡可能留下的所有動畫狀態一次清乾淨。
        modal.querySelectorAll('.card-3d-container').forEach(card => {
          card.classList.remove(
            'shaking',
            'gacha-edge-hold',
            'flipped',
            'v5-card-dropping'
          );

          card.style.removeProperty('--gacha-charge-duration');
          card.style.removeProperty('--v5-order');
        });

        modal.classList.remove(
          'has-gacha-card-flow',
          'v5-ten-pull-active'
        );

        modal.style.display = 'none';
      }

      if (cardBox) {
        cardBox.classList.remove('gacha-flow-stage');
      }

      // 下一輪 showGachaResults 仍會重新設定，這裡先恢復成乾淨的初始值。
      if (btnGroup) {
        btnGroup.style.opacity = '0';
        btnGroup.style.pointerEvents = 'none';
      }

      document.body.classList.remove('gacha-result-open');
    }







    // ==========================================

    // 重置資料

    // ==========================================



    function resetGameData() {





      showPickConfirm(



        "確定要重置所有圖鑑解鎖狀態與招賢令嗎？",



        "重 置 資 料",



        function () {





          localStorage.removeItem(

            'heroesData'

          );





          localStorage.removeItem(

            'specialFishingCaoUnlocked'

          );





          localStorage.removeItem(

            'specialFishingCaoClickCount'

          );





          localStorage.setItem(

            'userTokens',

            20

          );





          updateTokenUI(

            20

          );





          showPickAlert(



            "圖鑑解鎖狀態與招賢令已重置完成。",



            "重 置 完 成"



          );



        }



      );



    }





  </script>
