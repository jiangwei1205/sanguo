  <!-- =========================
       人物圖鑑主內容區
  ========================== -->
  <main class="codex-container">
    <!-- 第一層：陣營分類與已解鎖數量 -->
    <div class="codex-faction-bar">
      <div class="faction-menu">
        <button class="faction-tab active" data-faction="all">全部</button>
        <button class="faction-tab" data-faction="wei">魏</button>
        <button class="faction-tab" data-faction="shu">蜀</button>
        <button class="faction-tab" data-faction="wu">吳</button>
      </div>
      <div class="codex-progress" id="codexProgress">
        <div class="codex-progress-top">
          <span class="codex-progress-text" id="codexProgressText">已解鎖 0 / 0</span>
        </div>
        <div class="codex-progress-track" aria-hidden="true">
          <span class="codex-progress-fill" id="codexProgressFill"></span>
        </div>
      </div>
    </div>
    <!-- 第二層：控制面板 (稀有度與搜尋列) -->
    <div class="codex-panel">
      <div class="codex-sub-bar">
        <div class="rarity-filters">
          <button class="rarity-btn active" data-rarity="all">全部</button>
          <button class="rarity-btn" data-rarity="r">R</button>
          <button class="rarity-btn" data-rarity="sr">SR</button>
          <button class="rarity-btn" data-rarity="ssr">SSR</button>
        </div>
        <div class="search-box">
          <span class="search-icon"></span>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="搜尋武將..."
          >
        </div>
      </div>
    </div>
    <!-- 卡片網格 -->
    <div class="cards-grid" id="cardsGrid"></div>
    <div class="codex-empty-state" id="codexEmptyState" hidden>
      <div class="codex-empty-icon">◇</div>
      <h3>沒有符合條件的武將</h3>
      <p>請切換陣營、稀有度，或調整搜尋關鍵字後再試一次。</p>
    </div>

    <div class="codex-end-mark" aria-hidden="true">
      <span></span>
      <b>◇ 群英列傳 ◇</b>
      <span></span>
    </div>
  </main>
  <!-- =========================
       角色介紹彈窗
  ========================== -->
  <div class="hero-modal-overlay" id="heroModal">
    <div class="hero-modal-content">
      <button class="modal-close-btn" id="modalClose" aria-label="關閉角色介紹">
        ×
      </button>
      <div class="modal-body-layout">
        <!-- 左側：卡牌展示 -->
        <div class="modal-visual-column">
          <div class="modal-hero-img">
            <img id="modalImg" src="" alt="">
          </div>
          <div class="modal-card-footer">
            <span class="modal-card-footer-mark">◇</span>
            <span>武將列傳</span>
            <span class="modal-card-footer-mark">◇</span>
          </div>
          <!-- 人物介紹 Q 版 Sprite（曹操、劉備、張飛、孫權、關羽、司馬懿、呂布） -->
          <div class="modal-sprite-zone" id="modalSpriteZone" hidden>
            <div class="hero-speech" id="heroSpeech" role="status" aria-live="polite"></div>
            <button type="button" class="hero-sprite" id="heroSprite"
              aria-label="點擊武將，觀看專屬動作與台詞" title="點擊小武將"></button>
          </div>
        </div>
        <!-- 右側：人物資料 -->
        <div class="modal-info-area">
          <div class="modal-title-block">
            <h2 id="modalName">角色名稱</h2>
            <div class="modal-role-title" id="modalRoleTitle">
              三國人物｜群雄列傳
            </div>
          </div>
          <div class="modal-tags">
            <span class="modal-tag faction-tag" id="modalFaction">
              陣營
            </span>
            <span class="modal-tag rarity-tag" id="modalRarity">
              稀有度
            </span>
            <span class="modal-tag role-tag" id="modalRoleType">
              定位：武將
            </span>
          </div>
          <div class="modal-story-card history-card">
            <div class="modal-section-title">
              <span class="modal-section-icon">史</span>
              <h4>史實記載</h4>
            </div>
            <p id="modalHistory">
              這裡是史實記載的描述...
            </p>
          </div>
          <div class="modal-story-card novel-card">
            <div class="modal-section-title">
              <span class="modal-section-icon">演</span>
              <h4>小說演義</h4>
            </div>
            <p id="modalNovel">
              這裡是在演義小說中的描述...
            </p>
          </div>
          <!-- 人物羈絆 -->
          <div class="modal-relations-section" id="modalRelationsSection">
            <div class="modal-relations-heading">
              <div>
                <span class="modal-relations-symbol">◇</span>
                <strong>人物羈絆</strong>
                <span class="modal-relations-symbol">◇</span>
              </div>
              <small>與此人物關係密切的角色</small>
            </div>
            <div class="modal-relations-list" id="modalRelationsList"></div>
          </div>

          <div
            class="modal-special-bond"
            id="modalBondSection"
            style="display: none;"
          >
            <div class="modal-special-bond-title">
              <span>特殊羈絆</span>
              <small>閉月連環・飛將之緣</small>
            </div>
            <p id="modalBondText">
              你已發現貂蟬與呂布之間的特殊羈絆。
            </p>
          </div>
        </div>
      </div>
    </div>

        type="button"
        class="codex-alert-btn"
        id="codexAlertBtn"
      >
        確 定
      </button>
    </div>

        function createSpecialBurst(card) {
          const burst =
            card.querySelector(
              '.special-egg-burst'
            );
          if (!burst) return;
          burst.innerHTML = '';
          /*
             海水爆裂粒子
             - 水滴向四周噴散
             - 部分粒子變成泡泡
             - 上方水花距離更高，像浪花炸開
          */
          const particleCount =
            56;
          for (
            let i = 0;
            i < particleCount;
            i++
          ) {
            const particle =
              document.createElement(
                'span'
              );
            particle.className =
              'special-egg-particle';
            if (i % 5 === 0) {
              particle.classList.add(
                'special-egg-bubble'
              );
            }
            /*
              水花改成「由下往上扇形炸開」，
              不再做 360 度煙火狀。
            */
            const spread =
              i /
              (particleCount - 1);
            const dx =
              (spread - 0.5) *
              (
                220 +
                (i % 6) * 10
              );
            const dy =
              -(
                74 +
                (i % 9) * 15
              ) +
              Math.abs(dx) * 0.16;
            const size =
              5 +
              (i % 5) * 2;
            particle.style.setProperty(
              '--dx',
              `${dx}px`
            );
            particle.style.setProperty(
              '--dy',
              `${dy}px`
            );
            particle.style.setProperty(
              '--size',
              `${size}px`
            );
            particle.style.setProperty(
              '--delay',
              `${(i % 8) * 0.018}s`
            );
            particle.style.setProperty(
              '--spin',
              `${120 + (i % 6) * 35}deg`
            );
            burst.appendChild(
              particle
            );
          }

                  // 釣魚版曹操固定放在全部圖鑑的最後一張。
                  if (a.specialEgg) return 1;
                  if (b.specialEgg) return -1;
                  const rarityOrder = { ssr: 0, sr: 1, r: 2 };
                  return (rarityOrder[a.rarity] ?? 3) -
                    (rarityOrder[b.rarity] ?? 3);
                })
              : heroesData;

            heroesData.filter(
              hero => hero.unlocked
            ).length;

              const matchesFaction =
                (
                  currentFaction === 'all' ||
                  hero.faction === currentFaction

              const matchesRarity =
                (
                  currentRarity === 'all' ||
                  hero.rarity === currentRarity
                );
              const searchTarget =
                hero.unlocked
                  ? hero.name
                  : "？？？";
              const matchesSearch =
                (
                  currentSearch === '' ||
                  searchTarget.includes(
                    currentSearch

                );

                      draggable="false"
                      onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                      "
                    >
                    <div
                      style="
                        display:none;
                        width:100%;
                        height:100%;
                        align-items:center;
                        justify-content:center;
                        color:#e9bd5d;
                        font-size:28px;
                      "
                    >
                      ？
                    </div>
                    <span
                      class="special-egg-cracks"
                      aria-hidden="true"
                    ></span>
                    <span
                      class="special-egg-flash"
                      aria-hidden="true"
                    ></span>
                    <span
                      class="special-egg-wave-splash"
                      aria-hidden="true"
                    >
                      <img
                        src="images/wave-splash.png"
                        alt=""
                        draggable="false"
                      >
                    </span>
                  </div>
                  <div class="hero-name">
                    ？？？
                  </div>
                `;
                card.addEventListener(
                  'click',
                  () => {
                    handleSpecialEggClick(
                      hero,
                      card
                    );
                  }
                );
              } else {
                innerContent = `
                  <div class="hero-image-placeholder">
                    <img
                      src="${hero.lockedImage}"
                      alt="未解鎖"
                      onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                      "
                    >
                    <div
                      style="
                        display:none;
                        width:100%;
                        height:100%;
                        align-items:center;
                        justify-content:center;
                        color:#5c4d3d;
                        font-size:24px;
                      "
                    >
                      ？
                    </div>
                  </div>
                  <div class="hero-name">
                    ？？？
                  </div>
                `;
                card.addEventListener(
                  'click',
                  () => {
                    showCodexAlert(
                      "此武將尚未解鎖，請前往招賢台進行招募。",
                      "尚 未 解 鎖"
                    );
                  }
                );
              }
              card.innerHTML =
                innerContent;
              grid.appendChild(
                card
              );
            }
          );
          const totalCount =
            heroesData.length;
          const progressPercent =
            totalCount > 0
              ? (
                  unlockedCount /
                  totalCount
                ) * 100
              : 0;
          progressText.textContent =
            `已解鎖 ${unlockedCount} / ${totalCount}`;
          progressFill.style.width =
            `${progressPercent}%`;
          emptyState.hidden =
            visibleCount !== 0;
          grid.classList.toggle(
            'is-empty',
            visibleCount === 0
          );
        }
        // ==========================================
        // 武將 Q 版 Sprite：三格待機 + 四格點擊動作
        // 待機：原地 → 上半身微沉 → 原地 → 上半身微抬 ...
        // 點擊：1 → 2 → 3 → 4 → 1，之後恢復待機
        // ==========================================
        const heroSpriteConfig = {
          '曹操': {
            idleSheet: 'images/曹操待機.png',
            idleFrames: 3,
            sheet: 'images/曹操動作.png',
            frames: 4,
            line: '天下英雄，唯使君與操耳！'
          },
          '劉備': {
            idleSheet: 'images/劉備待機.png',
            idleFrames: 3,
            sheet: 'images/劉備動作.png',
            frames: 4,
            line: '備願與諸君共扶漢室！'
          },
          '張飛': {
            idleSheet: 'images/張飛待機.png',
            idleFrames: 3,
            sheet: 'images/張飛動作.png',
            frames: 4,
            line: '燕人張翼德在此！誰敢一戰！'
          },
          '孫權': {
            idleSheet: 'images/孫權待機.png',
            idleFrames: 3,
            sheet: 'images/孫權動作.png',
            frames: 4,
            line: '江東基業，孤自當守！'
          },
          '周瑜': {
            idleSheet: 'images/周瑜待機.png',
            idleFrames: 3,
            sheet: 'images/周瑜動作.png',
            frames: 4,
            line: '東風已至，且看江東烈焰！'
          },
          '趙雲': {
            idleSheet: 'images/趙雲待機.png',
            idleFrames: 3,
            sheet: 'images/趙雲動作.png',
            frames: 4,
            line: '常山趙子龍在此！誰敢一戰！'
          },
          '諸葛亮': {
            idleSheet: 'images/諸葛亮待機.png',
            idleFrames: 3,
            sheet: 'images/諸葛亮動作.png',
            frames: 4,
            line: '運籌帷幄之中，決勝千里之外！'
          },
          '黃蓋': {
            idleSheet: 'images/黃蓋待機.png',
            idleFrames: 3,
            sheet: 'images/黃蓋動作.png',
            frames: 4,
            line: '苦肉一計，烈火焚盡曹營！'
          },
          '龐統': {
            idleSheet: 'images/龐統待機.png',
            idleFrames: 3,
            sheet: 'images/龐統動作.png',
            frames: 4,
            line: '鳳雛展翼，奇謀定天下！'
          },
          '郭嘉': {
            idleSheet: 'images/郭嘉待機.png',
            idleFrames: 3,
            sheet: 'images/郭嘉動作.png',
            frames: 4,
            line: '鬼謀奇策，算定天下！'
          },
          '孫策': {
            idleSheet: 'images/孫策待機.png',
            idleFrames: 3,
            sheet: 'images/孫策動作.png',
            frames: 4,
            line: '江東小霸王，破陣開疆！'
          },
          '夏侯惇': {
            idleSheet: 'images/夏侯惇待機.png',
            idleFrames: 3,
            sheet: 'images/夏侯惇動作.png',
            frames: 4,
            line: '橫刀立馬，誰敢擋我！'
          },
          '甄姬': {
            idleSheet: 'images/甄姬待機.png',
            idleFrames: 3,
            sheet: 'images/甄姬動作.png',
            frames: 4,
            line: '洛水流光，花映芳華。'
          },
          '蔡文姬': {
            idleSheet: 'images/蔡文姬待機.png',
            idleFrames: 3,
            sheet: 'images/蔡文姬動作.png',
            frames: 4,
            line: '胡笳一曲，故園入夢。'
          },
          '孫尚香': {
            idleSheet: 'images/孫尚香待機.png',
            idleFrames: 3,
            sheet: 'images/孫尚香動作.png',
            frames: 4,
            line: '弓腰姬在此，看箭！'
          },
          '大喬小喬': {
            idleSheet: 'images/大喬小喬待機.png',
            idleFrames: 3,
            sheet: 'images/大喬小喬動作.png',
            frames: 4,
            line: '姊妹同心，花開並蒂！'
          },
          '關銀屏': {
            idleSheet: 'images/關銀屏待機.png',
            idleFrames: 3,
            sheet: 'images/關銀屏動作.png',
            frames: 4,
            line: '虎女乘風，青鋒破陣！'
          },
          '關羽': {
            idleSheet: 'images/關羽待機.png',
            idleFrames: 3,
            sheet: 'images/關羽動作.png',
            frames: 4,
            line: '義薄雲天，武聖千秋！'
          },
          '司馬懿': {
            idleSheet: 'images/司馬懿待機.png',
            idleFrames: 3,
            sheet: 'images/司馬懿動作.png',
            frames: 4,
            line: '韜光養晦，方能決勝千里！'
          },
          '貂蟬': {
            idleSheet: 'images/貂蟬待機.png',
            idleFrames: 3,
            sheet: 'images/貂蟬動作.png',
            frames: 4,
            line: '月下傾城，舞動天下。'
          },
          '釣魚版曹操': {
            idleSheet: 'images/釣魚版曹操待機.png',
            idleFrames: 3,
            sheet: 'images/釣魚版曹操動作.png',
            frames: 4,
            line: '哈哈哈！此魚，終究落入孤手！'
          },
          '呂布': {
            idleSheet: 'images/呂布待機.png',
            idleFrames: 3,
            sheet: 'images/呂布動作.png',
            frames: 4,
            line: '天下群雄，誰敢擋我呂奉先！'
          }
        };
        let activeSpriteConfig = null;
        let activeSpriteHeroName = null;
        let spriteIdleTimer = null;
        let spriteFrameTimer = null;
        let spriteSpeechTimer = null;
        let spritePlaying = false;

        function setSpriteFrame(frame, frames) {
          // 3 格的位置是 0 / 50 / 100%；4 格是 0 / 33.33 / 66.67 / 100%。
          heroSprite.style.backgroundPosition =
            `${(frame / (frames - 1)) * 100}% 0%`;
        }

        function startHeroIdle(config) {
          clearInterval(spriteIdleTimer);
          spriteIdleTimer = null;
          if (!config || !config.idleSheet) return;

          heroSprite.classList.remove('is-playing');
          heroSprite.style.backgroundImage = `url("${config.idleSheet}")`;
          heroSprite.style.backgroundSize = `${config.idleFrames * 100}% 100%`;
          setSpriteFrame(0, config.idleFrames);

          // 尊重裝置的減少動態偏好，仍顯示第一格站立姿勢。
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

          const sequence = [0, 1, 0, 2];
          let step = 0;
          spriteIdleTimer = setInterval(() => {
            step = (step + 1) % sequence.length;
            setSpriteFrame(sequence[step], config.idleFrames);
          }, 400);
        }

        function stopHeroSprite() {
          clearInterval(spriteIdleTimer);
          clearInterval(spriteFrameTimer);
          clearTimeout(spriteSpeechTimer);
          spriteIdleTimer = null;
          spriteFrameTimer = null;
          spriteSpeechTimer = null;
          spritePlaying = false;
          heroSprite.classList.remove('is-playing');
          heroSprite.style.backgroundPosition = '0% 0%';
          heroSpeech.classList.remove('show');
          heroSpeech.textContent = '';
        }

        function setupHeroSprite(hero) {
          stopHeroSprite();
          activeSpriteHeroName = hero.name;
          activeSpriteConfig = heroSpriteConfig[hero.name] || null;
          modalSpriteZone.hidden = !activeSpriteConfig;
          if (!activeSpriteConfig) {
            heroSprite.style.backgroundImage = 'none';
            return;
          }
          heroSprite.setAttribute('aria-label', `點擊${hero.name}，觀看專屬動作與台詞`);
          heroSprite.title = `點擊小${hero.name}`;
          startHeroIdle(activeSpriteConfig);
        }

        // 點擊時暫停待機，完成 4 格動作後再恢復三格待機。
        heroSprite.addEventListener('click', () => {
          if (!activeSpriteConfig || spritePlaying) return;
          const config = activeSpriteConfig;
          clearInterval(spriteIdleTimer);
          clearTimeout(spriteSpeechTimer);
          spriteIdleTimer = null;
          spriteSpeechTimer = null;
          heroSpeech.classList.remove('show');

          if (
            warriorSpriteHeroes.has(
              activeSpriteHeroName
            )
          ) {
            playWarriorSpriteSound();
          } else if (
            archerSpriteHeroes.has(
              activeSpriteHeroName
            )
          ) {
            playArcherSpriteSound();
          } else if (
            rulerSwordHeroes.has(
              activeSpriteHeroName
            )
          ) {
            playRulerSwordSound();
          } else if (
            rulerRobeHeroes.has(
              activeSpriteHeroName
            )
          ) {
            playRulerRobeSound();
          } else if (
            strategistFanHeroes.has(
              activeSpriteHeroName
            )
          ) {
            playStrategistFanSound();
          }

          spritePlaying = true;
          heroSprite.classList.add('is-playing');
          heroSprite.style.backgroundImage = `url("${config.sheet}")`;
          heroSprite.style.backgroundSize = `${config.frames * 100}% 100%`;
          setSpriteFrame(0, config.frames);

          let frame = 0;
          spriteFrameTimer = setInterval(() => {
            frame += 1;
            if (frame >= config.frames) {
              clearInterval(spriteFrameTimer);
              spriteFrameTimer = null;
              spritePlaying = false;
              startHeroIdle(config);
              spriteSpeechTimer = setTimeout(() => {
                heroSpeech.classList.remove('show');
                spriteSpeechTimer = null;
              }, 2300);
              return;
            }
            setSpriteFrame(frame, config.frames);
            if (frame === 2) {
              // 女角音效刻意對齊動作第 3 格，
              // 讓琴音／女聲落在最明顯的動作節點。
              if (
                caiWenJiHeroes.has(
                  activeSpriteHeroName
                )
              ) {
                playCaiWenJiSound();
              } else if (
                daQiaoXiaoQiaoHeroes.has(
                  activeSpriteHeroName
                )
              ) {
                playDaQiaoXiaoQiaoSound();
              } else if (
                diaoChanHeroes.has(
                  activeSpriteHeroName
                )
              ) {
                playDiaoChanSound();
              } else if (
                zhenJiHeroes.has(
                  activeSpriteHeroName
                )
              ) {
                playZhenJiSound();
              }

              heroSpeech.textContent = config.line;
              heroSpeech.classList.add('show');
            }
          }, 220);
        });

        // ==========================================
        // 開啟角色介紹
        // ==========================================
        function openModal(hero) {
          const modalWasOpen =
            modal.classList.contains(
              "active"
            );

          if (!modalWasOpen) {
            playCodexOpenSound();
          }

          modalImg.src = hero.image;
          modalImg.alt = `${hero.name} 卡牌`;
          modalName.textContent = hero.name;

          renderHeroRelations(hero);

          const factionMap = {
            wei: "陣營：魏",
            shu: "陣營：蜀",
            wu: "陣營：吳",
            special: "陣營：群"
          };

          const factionKey =
            hero.faction || "special";
          const rarityKey =
            (hero.rarity || "r").toLowerCase();

          modalFaction.textContent =
            factionMap[factionKey] || "陣營";
          modalFaction.dataset.faction =
            factionKey;

          modalRarity.textContent =
            `稀有度：${rarityKey.toUpperCase()}`;
          modalRarity.dataset.rarity =
            rarityKey;

          modalHistory.textContent =
            hero.history ||
            "暫無史實記載資料。";
          modalNovel.textContent =
            hero.novel ||
            "暫無小說演義資料。";

          const lubu =
            heroesData.find(
              h => h.name === "呂布"
            );

          /*
             只有完成右下角「呂布 × 貂蟬」NPC 彩蛋、
             呂布真的變成 unlocked 之後，貂蟬頁才顯示特殊羈絆。
          */
          if (
            hero.name === "貂蟬" &&
            hero.unlocked &&
            lubu &&
            lubu.unlocked
          ) {
            modalBondSection.style.display =
              "block";
            modalBondText.textContent =
              "你已發現貂蟬與呂布之間的特殊羈絆。飛將與閉月，終於在亂世中重逢。";
          } else {
            modalBondSection.style.display =
              "none";
          }

          setupHeroSprite(hero);

          if (modalContent) {
            modalContent.scrollTop = 0;
          }

          modal.classList.add("active");
          document.body.classList.add(
            "hero-modal-open"
          );
        }

        // ==========================================
        // 關閉 Modal
        // ==========================================
        function closeHeroModal() {
          modal.classList.remove(
            "active"
          );
          document.body.classList.remove(
            "hero-modal-open"
          );
          stopHeroSprite();
        }

        modalClose.addEventListener(
          "click",
          closeHeroModal
        );

        modal.addEventListener(
          "click",
          (event) => {
            if (event.target === modal) {
              closeHeroModal();
            }
          }
        );

        document.addEventListener(
          "keydown",
          (event) => {
            if (
              event.key === "Escape" &&
              modal.classList.contains(
                "active"
              ) &&
              !codexAlert.classList.contains(
                "show"
              )
            ) {
              closeHeroModal();
            }
          }
        );
        // ==========================================
        // 陣營篩選
        // ==========================================
        factionTabs.forEach(
          tab => {
            tab.addEventListener(
              'click',
              function () {
                factionTabs.forEach(
                  t =>
                    t.classList.remove(
                      'active'
                    )
                );
                this.classList.add(
                  'active'
                );
                currentFaction =
                  this.getAttribute(
                    'data-faction'
                  );
                renderCards();
              }
            );
          }
        );
        // ==========================================
        // 稀有度篩選
        // ==========================================
        rarityBtns.forEach(
          btn => {
            btn.addEventListener(
              'click',
              function () {
                rarityBtns.forEach(
                  b =>
                    b.classList.remove(
                      'active'
                    )
                );
                this.classList.add(
                  'active'
                );
                currentRarity =
                  this.getAttribute(
                    'data-rarity'
                  );
                renderCards();
              }
            );
          }
        );
        // ==========================================
        // 搜尋
        // ==========================================
        searchInput.addEventListener(
          'input',
          function () {
            currentSearch =
              this.value.trim();
            renderCards();
          }
        );
        // ==========================================
        // 呂布 NPC 彩蛋完成後，同頁同步人物圖鑑
        // ==========================================
        const npcCharacterForCodex =
          document.getElementById(
            'npcCharacter'
          );
        function syncHeroesFromStorage() {
          try {
            const latestHeroes =
              JSON.parse(
                localStorage.getItem(
                  'heroesData'
                ) || '[]'
              );
            if (!Array.isArray(latestHeroes)) {
              return;
            }
            const latestHeroMap =
              new Map(
                latestHeroes.map(
                  hero => [
                    hero.name,
                    hero
                  ]
                )
              );
            heroesData =
              heroesData.map(
                hero => {
                  const latestHero =
                    latestHeroMap.get(
                      hero.name
                    );
                  if (!latestHero) {
                    return hero;
                  }
                  return {
                    ...hero,
                    unlocked:
                      latestHero.unlocked === true
                  };
                }
              );
            renderCards();
          } catch (error) {
            console.warn(
              '人物圖鑑同步失敗：',
              error
            );
          }
        }
        if (npcCharacterForCodex) {
          npcCharacterForCodex.addEventListener(
            'click',
            () => {
              /*
                 main.js 會在玩家符合條件時把呂布寫入 localStorage。
                 等親吻動畫差不多播放完，再讓這一頁的呂布卡翻成已解鎖。
              */
              setTimeout(
                syncHeroesFromStorage,
                4700
              );
            }
          );
        }
        // ==========================================
        // 第一次載入
        // ==========================================
        renderCards();
      }
    );
  </script>
